name: Deploy AutoRateFinder

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html home-v2.css home-v2.js dark-theme.css compact-mobile.css app.js robots.txt sitemap.xml privacy.html terms.html disclosure.html compare-car-insurance.html car-insurance-discounts.html car-insurance-deductible-guide.html _site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          dark = '<link rel="stylesheet" href="dark-theme.css?v=20260913-dark3">'
          compact = '<link rel="stylesheet" href="compact-mobile.css?v=20260913-compact1">'
          if dark not in s:
              s = s.replace('</head>', f'  {dark}\n</head>')
          if compact not in s:
              s = s.replace('</head>', f'  {compact}\n</head>')
          p.write_text(s, encoding='utf-8')
          PY
          if compgen -G 'google*.html' > /dev/null; then cp google*.html _site/; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
