name: Deploy AutoRateFinder

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css dense-v3.css app.js analytics.js partner-integration.js favicon.svg robots.txt sitemap.xml privacy.html terms.html disclosure.html compare-car-insurance.html car-insurance-discounts.html car-insurance-deductible-guide.html car-insurance-quotes.html cheap-car-insurance.html car-insurance-rates-by-zip-code.html full-coverage-car-insurance.html _site/
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = 'https://martinus998.github.io/AutoRateFinder/'
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          dense = '<link rel="stylesheet" href="dense-v3.css?v=20260913-original">'
          if dense not in s:
              s = s.replace('</head>', dense + '\n</head>')
          s = re.sub(r'<title>.*?</title>', '<title>Compare Car Insurance | AutoRateFinder</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Preview AutoRateFinder, a U.S.-focused car insurance comparison platform preparing approved licensed carrier and referral integrations.">', s, count=1)
          seo = '\n'.join([
              '<meta name="robots" content="index,follow,max-image-preview:large">',
              '<link rel="canonical" href="https://martinus998.github.io/AutoRateFinder/">',
              '<link rel="alternate" hreflang="en-us" href="https://martinus998.github.io/AutoRateFinder/">',
              '<link rel="alternate" hreflang="x-default" href="https://martinus998.github.io/AutoRateFinder/">',
              '<link rel="icon" type="image/svg+xml" href="favicon.svg">',
              '<meta name="theme-color" content="#021426">',
              '<meta property="og:type" content="website">',
              '<meta property="og:site_name" content="AutoRateFinder">',
              '<meta property="og:title" content="Compare Car Insurance | AutoRateFinder">',
              '<meta property="og:description" content="Preview the AutoRateFinder comparison experience while approved licensed carrier and referral integrations are being prepared.">',
              '<meta property="og:url" content="https://martinus998.github.io/AutoRateFinder/">',
              '<meta name="twitter:card" content="summary">',
              '<meta name="twitter:title" content="Compare Car Insurance | AutoRateFinder">',
              '<meta name="twitter:description" content="A clear U.S. car-insurance comparison preview with coverage, deductible and discount tools.">',
              '<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","name":"AutoRateFinder","url":"https://martinus998.github.io/AutoRateFinder/","logo":"https://martinus998.github.io/AutoRateFinder/favicon.svg"},{"@type":"WebSite","name":"AutoRateFinder","url":"https://martinus998.github.io/AutoRateFinder/","description":"U.S.-focused car-insurance comparison technology preparing approved licensed partner integrations.","inLanguage":"en-US"},{"@type":"WebApplication","name":"AutoRateFinder","url":"https://martinus998.github.io/AutoRateFinder/","applicationCategory":"FinanceApplication","operatingSystem":"Web","isAccessibleForFree":true},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Are these insurer prices live quotes?","acceptedAnswer":{"@type":"Answer","text":"No. The current comparison is a pre-launch preview using fictional sample carrier labels and prices until an approved licensed quote partner is connected."}},{"@type":"Question","name":"Do I need a phone number to start?","acceptedAnswer":{"@type":"Answer","text":"No phone number is required to start the current educational comparison preview."}},{"@type":"Question","name":"Does AutoRateFinder sell insurance?","acceptedAnswer":{"@type":"Answer","text":"No. AutoRateFinder is comparison and referral technology, not an insurer or licensed insurance producer."}}]}]}</script>'
          ])
          if 'rel="canonical" href="https://martinus998.github.io/AutoRateFinder/"' not in s:
              s = s.replace('</head>', seo + '\n</head>')
          resources = '<span><a href="compare-car-insurance.html">Compare insurance</a> · <a href="car-insurance-quotes.html">Quotes guide</a> · <a href="cheap-car-insurance.html">Cheap car insurance</a> · <a href="car-insurance-rates-by-zip-code.html">Rates by ZIP</a> · <a href="full-coverage-car-insurance.html">Full coverage</a> · <a href="car-insurance-discounts.html">Discounts</a> · <a href="car-insurance-deductible-guide.html">Deductibles</a></span>'
          if 'car-insurance-quotes.html' not in s:
              s = s.replace('<span><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclosure.html">Affiliate disclosure</a></span>', resources + '<span><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclosure.html">Affiliate disclosure</a></span>')
          p.write_text(s, encoding='utf-8')
          for p in Path('_site').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              common = '<link rel="icon" type="image/svg+xml" href="favicon.svg">\n<meta name="theme-color" content="#021426">'
              if 'favicon.svg' not in s:
                  s = s.replace('</head>', common + '\n</head>')
              analytics = '<script src="analytics.js" defer></script>'
              if 'src="analytics.js"' not in s:
                  s = s.replace('</head>', analytics + '\n</head>')
              if p.name == 'index.html':
                  partner = '<script src="partner-integration.js" defer></script>'
                  if 'src="partner-integration.js"' not in s:
                      s = s.replace('</head>', partner + '\n</head>')
              p.write_text(s, encoding='utf-8')
          legal = {
              'privacy.html': ('Privacy Notice | AutoRateFinder', 'How AutoRateFinder handles information in the current U.S. car-insurance comparison preview.', root + 'privacy.html'),
              'terms.html': ('Terms of Use | AutoRateFinder', 'Terms for using the AutoRateFinder educational car-insurance comparison preview.', root + 'terms.html'),
              'disclosure.html': ('Affiliate Disclosure | AutoRateFinder', 'How AutoRateFinder may earn referral or affiliate compensation when licensed partner connections are enabled.', root + 'disclosure.html'),
          }
          for filename, (title, desc, canonical) in legal.items():
              p = Path('_site') / filename
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<title>.*?</title>', f'<title>{title}</title>', s, count=1, flags=re.S)
              if 'name="description"' not in s:
                  s = s.replace('</head>', f'<meta name="description" content="{desc}">\n</head>')
              if 'rel="canonical"' not in s:
                  tags = '\n'.join([
                      f'<link rel="canonical" href="{canonical}">',
                      '<meta property="og:type" content="website">',
                      f'<meta property="og:title" content="{title}">',
                      f'<meta property="og:description" content="{desc}">',
                      f'<meta property="og:url" content="{canonical}">'
                  ])
                  s = s.replace('</head>', tags + '\n</head>')
              p.write_text(s, encoding='utf-8')
          PY
          if compgen -G 'google*.html' > /dev/null; then cp google*.html _site/; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
